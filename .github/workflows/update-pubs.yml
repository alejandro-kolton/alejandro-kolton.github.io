# Actualiza la lista de publicaciones desde arXiv una vez por semana.
# También se puede correr a mano: pestaña "Actions" → "Update publications" → "Run workflow".
name: Update publications

on:
  schedule:
    - cron: "0 9 * * 1"   # lunes 09:00 UTC (06:00 en Argentina)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar lista desde arXiv
        run: python3 scripts/update_pubs.py
        env:
          JREF_REPORT: ${{ runner.temp }}/jref.md

      # Avisa (con un issue, que GitHub manda por mail) cuando un trabajo ya
      # publicado tiene volumen/página en Crossref pero le falta la journal-ref en arXiv.
      - name: Issue de journal-refs pendientes en arXiv
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/jref.md
        run: |
          TITLE="Journal-refs pendientes en arXiv"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
                --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -s "$REPORT" ]; then
            if [ -z "$NUM" ]; then
              gh issue create --title "$TITLE" --body-file "$REPORT"
            else
              OLD=$(gh issue view "$NUM" --json body --jq .body)
              if [ "$OLD" != "$(cat "$REPORT")" ]; then
                gh issue edit "$NUM" --body-file "$REPORT"
                gh issue comment "$NUM" --body "La lista cambió (hay trabajos recién publicados o ya corregidos)."
              fi
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Ya no hay journal-refs pendientes."
          fi

      - name: Commit si hubo cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Actualizar publicaciones desde arXiv"
          git push
